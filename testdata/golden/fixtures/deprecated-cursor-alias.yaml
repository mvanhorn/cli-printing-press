openapi: "3.1.0"
info:
  title: Xquik API
  version: "1.0"
  description: >-
    Xquik is an independent third-party service. Not affiliated with X Corp.
    "Twitter" and "X" are trademarks of X Corp.
servers:
  - url: https://xquik.com/api/v1
security:
  - apiKey: []
paths:
  /x/users/{id}/followers:
    get:
      tags: [Users]
      operationId: getUserFollowers
      summary: List followers of a user
      parameters:
        - name: id
          in: path
          required: true
          description: Target user ID or username for follower lookup.
          schema:
            type: string
        - name: cursor
          in: query
          description: Cursor from the previous response.
          schema:
            type: string
        - name: after
          in: query
          deprecated: true
          description: Legacy cursor alias. Prefer cursor.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum user profiles to return.
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                  next_cursor:
                    type: string
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Xquik API key passed through the x-api-key header.
