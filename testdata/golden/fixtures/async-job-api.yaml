openapi: "3.0.3"
info:
  title: Async Job API
  version: "1.0.0"
  description: |
    Golden fixture exercising async-job detection: POST returns a job_id-shaped
    response with a sibling GET status endpoint, triggering jobs.go emission.
servers:
  - url: https://api.example.com/v1
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    RenderJob:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
paths:
  /renders:
    post:
      tags: [renders]
      operationId: submitRender
      summary: Submit a render job
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
  /renders/{id}:
    get:
      tags: [renders]
      operationId: getRender
      summary: Get a render job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
  # /media/upload exercises the free-upload replay default: a file-carrying
  # POST with an upload path segment is marked replay-safe, so the client
  # retries it (with a size-scaled deadline) while the paid /renders submit
  # above never replays after an ambiguous failure.
  /media/upload:
    post:
      tags: [media]
      operationId: uploadMedia
      summary: Upload an input file
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
